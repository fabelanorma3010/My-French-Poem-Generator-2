<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>French Poems</title>
  </head>
  <body>
    <header>
      <h1>French Poems</h1>
    </header>
    <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic of the french poem"
          autofocus
          required
          autocomplete="off"
          class="instruction"
        />
        <input type="submit" />
      </form>
    </main>
    <footer>
      This was coded by Norma Fabela and is open source on GitHub
      <a
        href="https://github.com/fabelanorma3010/My-french-poem-Generator-system"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
    </footer>

    <script src="src/index.js"></script>
  </body>
</html>
