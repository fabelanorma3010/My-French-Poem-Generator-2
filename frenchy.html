<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@3/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>English Poems</title>
  </head>
  <body>
    <div class="falling-stars" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="page-opening" aria-hidden="true">
      <div class="page-opening__panel page-opening__panel--top-left"></div>
      <div class="page-opening__panel page-opening__panel--top-right"></div>
      <div class="page-opening__panel page-opening__panel--bottom-left"></div>
      <div class="page-opening__panel page-opening__panel--bottom-right"></div>
      <div class="page-opening__ribbon page-opening__ribbon--vertical"></div>
      <div class="page-opening__ribbon page-opening__ribbon--horizontal"></div>
      <div class="page-opening__bow"></div>
    </div>
    <div class="container">
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-pressed="false"
      >
        Light mode: Off
      </button>
      <div class="siren-light is-off" aria-hidden="true">
        <span class="siren-light__lamp siren-light__lamp--red"></span>
        <span class="siren-light__lamp siren-light__lamp--blue"></span>
        <span class="siren-light__base"></span>
      </div>
      <button
        class="siren-toggle"
        id="siren-toggle"
        type="button"
        aria-pressed="false"
      >
        Siren: Off
      </button>
      <section class="ambient-player" aria-labelledby="ambient-heading">
        <div class="ambient-player__title">
          <h2 id="ambient-heading">Soft relaxing music</h2>
          <span id="ambient-status" role="status" aria-live="polite">Paused</span>
        </div>
        <div class="ambient-player__controls">
          <button
            class="ambient-toggle"
            id="ambient-toggle"
            type="button"
            aria-pressed="false"
          >
            Play music
          </button>
          <label for="ambient-volume">Volume</label>
          <input
            id="ambient-volume"
            type="range"
            min="0"
            max="0.5"
            step="0.01"
            value="0.18"
          />
        </div>
      </section>
      <main>
        <div class="generator-stage">
          <div class="form-container">
            <header>
              <h1>English Poems</h1>
            </header>
            <form id="poem-generator-form">
              <input
                type="text"
                placeholder="Enter the topic of the English poem"
                required
                autocomplete="off"
                class="instructions"
                id="user-instructions"
              />
              <input type="submit" class="submit-button" />
            </form>
            <div class="hint">
              hint: i.e: Flower, Paris, Cheese, Love, Life, Angels, or Healing
            </div>
          </div>
        </div>
        <div class="letter-scene" id="letter-scene">
          <div class="envelope" aria-hidden="true">
            <div class="envelope__body"></div>
            <div class="envelope__flap"></div>
          </div>
          <div class="poem" id="poem">Your poem will appear here.</div>
          <div class="poem-actions">
            <button
              class="save-poem-button hidden"
              id="save-poem-button"
              type="button"
              disabled
            >
              Save poem
            </button>
            <span
              class="save-status"
              id="save-status"
              role="status"
              aria-live="polite"
            ></span>
          </div>
        </div>
        <section
          class="saved-poems hidden"
          id="saved-poems"
          aria-labelledby="saved-poems-heading"
        >
          <h2 id="saved-poems-heading">Saved poems</h2>
          <ul class="saved-poem-list" id="saved-poem-list"></ul>
        </section>
      </main>
      <footer>
        This was coded by Norma Fabela and is open source on GitHub
        <a
          href="https://github.com/fabelanorma3010/My-french-poem-Generator-system"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </footer>
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
